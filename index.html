<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <header>
            <small>JavaScript Practicum · Assignment 3</small>
            <h1>Calculator</h1>
            <p>One operation at a time, from your first number to the final answer.</p>
        </header>

        <section class="panel calculator" aria-label="Calculator">
            <output id="display" aria-live="polite">0</output>
            <p id="message" role="status">Ready to calculate.</p>

            <div class="keypad">
                <button data-key="Clear" class="wide">Clear</button>
                <button data-key="Backspace" class="wide" aria-label="Backspace">⌫</button>
                <button data-key="/" class="primary" aria-label="Divide">÷</button>

                <button data-key="7">7</button>
                <button data-key="8">8</button>
                <button data-key="9">9</button>
                <button data-key="*" class="primary" aria-label="Multiply">×</button>

                <button data-key="4">4</button>
                <button data-key="5">5</button>
                <button data-key="6">6</button>
                <button data-key="-" class="primary" aria-label="Subtract">−</button>

                <button data-key="1">1</button>
                <button data-key="2">2</button>
                <button data-key="3">3</button>
                <button data-key="+" class="primary" aria-label="Add">+</button>

                <button data-key="0" class="zero">0</button>
                <button data-key=".">.</button>
                <button data-key="=" class="equals" aria-label="Equals">=</button>
            </div>
        </section>

        <p>Keyboard: digits, + − * /, Enter or =, Backspace, Escape to clear.</p>
        <footer>Built with HTML, CSS and JavaScript.</footer>
    </main>
</body>
</html>
